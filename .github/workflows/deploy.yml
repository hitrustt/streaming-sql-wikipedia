name: Deploy to GitHub Pages

on:
  push:
    # Both, because GitHub's default branch name depends on when and how the
    # repo was created; triggering on only one silently never runs.
    branches: [main, master]
  # Lets the deployment be re-run from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; cancel-in-progress is off so a queued
# deploy still completes rather than being dropped mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The tests are the reason to trust a deploy, so a failure here stops it.
      - run: npm test

      - run: npm run build
        env:
          # GitHub Pages serves a project site from /<repo>/, so assets must be
          # built against that prefix.
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
